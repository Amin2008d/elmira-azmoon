<script>(function(){var t;try{t=localStorage.getItem('ea-theme');}catch(e){}var d=t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.classList.add(d?'dark':'light');})();</script>

<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  @custom-variant dark (&:where(.dark, .dark *));
  @theme inline {
    --color-bg: var(--bg);
    --color-bg-2: var(--bg-2);
    --color-tint: var(--tint);
    --color-card: var(--card);
    --color-ink: var(--ink);
    --color-ink-2: var(--ink-2);
    --color-line: var(--line);
    --color-deep: var(--deep);
    --color-wine: var(--wine);
    --color-wine-ink: var(--wine-ink);
    --color-blush: var(--blush);
    --font-sans: "Vazirmatn", system-ui, sans-serif;
    --font-display: "Markazi Text", "Vazirmatn", serif;
  }
  @utility wrap {
    margin-inline: auto;
    width: 100%;
    max-width: 1240px;
    padding-inline: 1rem;
    @media (width >= 768px) { padding-inline: 2rem; }
  }
</style>
